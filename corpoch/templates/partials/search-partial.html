{% if users or charts %}
<ul>
    {% for user in users %}
        <li class='result-item'>
            <a href="{% url 'profile' user.id %}"><p>(User) {{ user.global_name }}</p></a>
        </li>
    {% endfor %}
    {% for chart in charts %}
        <li class='result-item'>
            <a href="{% url 'chart' chart.id %}"><p>(Chart) {{ chart.tournament_name }}</p></a>
        </li>
    {% endfor %}
</ul>
{% else %}
<ul>
    <li><p>No results found.</p></li>
</ul>
{% endif %}
