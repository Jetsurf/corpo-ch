<style>
.dropdown-content p, h4 {
    color: white;
    cursor: default;
}

.dropdown-content a:hover {
    background-color: #f1f1f1
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropdown-content:hover {
    display: block;
}
</style>

{% if users %}
<div class="dropdown-content">
 	<ul>
	{% for user in users %}
		<li class='result-item'>
			<a href="{% url 'profile' user.id %}" ><p>{{ user.global_name }}</p></a>
		</li>
	{% endfor %}
	</ul>
</div>
{% else %}
<div class="dropdown-content">
	<li><p>No users found.</p></li>
</div>
{% endif %}
