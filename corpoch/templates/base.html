{% load static %}
<!DOCTYPE html>
<!--- Discord OpenGraph Embeds --->
<meta content="Corpo CH" property="og:site_name"/>
<meta content="#27F598" property="theme-color"/>
<meta content="website" property="og:type"/>
<style>
html, body {
	margin: 0;
	padding: 0;
	height: 100%;
}

body {
	display: flex;
	flex-direction: column;
	min-height: 100vh;
}

main {
	flex: 1;
}
</style>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Document{% endblock %}</title>
	<link rel="shortcut icon" type="image/png" href="{% static 'mainapp/favicon.ico' %}">
	{% block style %}
	<link rel="stylesheet" href="{% static 'mainapp/bootstrap/css/bootstrap.min.css' %}">
	<link href="{% static 'mainapp/css/Varela.css' %}" rel='stylesheet'>
	<link href="{% static 'mainapp/fontawesome-free-5.15.3-web/css/all.min.css'%}" rel="stylesheet" type="text/css">
	{% endblock %}
</head>
<body {% block body%}{% endblock %}>
	<main>
		{% block content %}
		{% endblock %}
	</main>
	{% block footer %}
	<footer class="text-center text-white"> 
		<div class="container">
		  <section>
			<a class="btn btn-lg btn-outline-light btn-floating m-3 ml-auto" href="https://github.com/Jetsurf/corpo-ch" role="button" target="_blank"><i class="fab fa-github"></i></a>
		  </section>
		</div>
		<div class="text-center p-3 footer">
		  [CORP] Gang! - <a href="/privterms">Privacy/Terms</a>
		</div>
	  </footer>
	{% endblock %}
	{% block js %}
	{% endblock %}    
</body>
</html>
